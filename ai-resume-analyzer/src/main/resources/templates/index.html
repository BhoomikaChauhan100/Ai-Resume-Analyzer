
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-8 col-lg-6">


            <!-- Main Card -->
            <div class="card shadow-lg border-0 rounded-4 text-center">

                <div class="card-body p-5">


                    <!-- Logo / Title -->
                    <div class="mb-4">

                        <div class="display-3 mb-3">
                            🚀
                        </div>

                        <h1 class="fw-bold text-primary">
                            AI Resume Analyzer
                        </h1>

                    </div>


                    <!-- Message -->
                    <h3 class="fw-semibold mb-3">
                        Project Started Successfully
                    </h3>

                    <p class="text-muted mb-4">
                        Analyze your resume, improve your ATS score,
                        and discover better job opportunities.
                    </p>


                    <!-- Buttons -->
                    <div class="d-flex justify-content-center gap-3">


                        <a
                            th:href="@{/auth/login}"
                            class="btn btn-primary btn-lg rounded-3 px-4">

                            Login

                        </a>


                        <a
                            th:href="@{/register}"
                            class="btn btn-outline-primary btn-lg rounded-3 px-4">

                            Register

                        </a>


                    </div>


                </div>

            </div>


            <!-- Footer -->
            <p class="text-center text-muted mt-4 small">

                © 2026 AI Resume Analyzer

            </p>


        </div>

    </div>

</div>


</body>

</html>
