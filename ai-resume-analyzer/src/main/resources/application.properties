# ============================================================
# APPLICATION NAME
# ============================================================

spring.application.name=ai-resume-analyzer


# ============================================================
# SERVER CONFIGURATION
# ============================================================

# Application port
server.port=8080


# ============================================================
# MYSQL DATABASE CONFIGURATION
# ============================================================

# Database URL
# Replace ai_resume_analyzer with your database name
 spring.datasource.url=${DB_URL}


# MySQL Username
# Replace with your MySQL username
spring.datasource.username=${DB_USERNAME}

# MySQL Password
# Replace with your MySQL password

 spring.datasource.password=${DB_PASSWORD}

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================

# Automatically update database tables
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=true

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ============================================================
# THYMELEAF CONFIGURATION
# ============================================================

# Disable cache while development
spring.thymeleaf.cache=false


# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================

# Maximum file size
spring.servlet.multipart.max-file-size=10MB

# Maximum request size
spring.servlet.multipart.max-request-size=10MB


# ============================================================
# JWT CONFIGURATION
# ============================================================

# Replace with a long random secret key (at least 32 characters)
jwt.secret=${JWT_SECRET}

# Token validity in milliseconds (24 hours)
jwt.expiration=86400000


# ============================================================
# GEMINI API CONFIGURATION
# ============================================================

# Gemini API Key
# Replace with your API Key
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.6-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models


# ============================================================
# BREVO EMAIL CONFIGURATION
# ============================================================

# Brevo API Key
brevo.api.key=${BREVO_API_KEY}

# Sender Email
brevo.sender.email=bhoomikachauhan2006@gmail.com

# Sender Name
brevo.sender.name=AI Resume Analyzer


# ============================================================
# ADZUNA JOB API CONFIGURATION
# ============================================================

# Replace with your Adzuna App ID
adzuna.app.id=${ADZUNA_APP_ID}

# Replace with your Adzuna App Key
adzuna.api.key=${ADZUNA_API_KEY}

# Country Code (India)
adzuna.country=in


# ============================================================
# FILE STORAGE
# ============================================================

# Folder where uploaded resumes will be stored
file.upload-dir=uploads/


# ============================================================
# LOGGING
# ============================================================

# Show Spring Security logs
logging.level.org.springframework.security=DEBUG