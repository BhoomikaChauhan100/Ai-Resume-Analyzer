<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Saved Jobs | AI Resume Analyzer</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">


<nav class="navbar navbar-light bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold text-primary"
           th:href="@{/dashboard}">

            🚀 AI Resume Analyzer

        </a>

        <a th:href="@{/dashboard}"
           class="btn btn-outline-primary btn-sm">

            ← Dashboard

        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="mb-4">

        <h2 class="fw-bold">
            ❤️ Saved Jobs
        </h2>

        <p class="text-muted">
            Jobs you saved for later.
        </p>

    </div>


    <!-- No Jobs -->

    <div th:if="${#lists.isEmpty(savedJobs)}"
         class="card border-0 shadow-sm rounded-4">

        <div class="card-body text-center py-5">

            <div class="fs-1">
                💼
            </div>

            <h5 class="fw-bold mt-3">
                No saved jobs yet
            </h5>

            <p class="text-muted">
                Save interesting jobs and find them here.
            </p>

            <a th:href="@{/jobs/recommendations}"
               class="btn btn-primary">

                Find Jobs

            </a>

        </div>

    </div>


    <!-- Saved Jobs -->

    <div th:each="job : ${savedJobs}"
         class="card border-0 shadow-sm rounded-4 mb-3">

        <div class="card-body p-4">

            <div class="d-flex justify-content-between">

                <div>

                    <h5 class="fw-bold"
                        th:text="${job.title}">

                        Job Title

                    </h5>

                    <p class="mb-1">

                        🏢

                        <span th:text="${job.company}">
                            Company
                        </span>

                    </p>

                    <p class="text-muted">

                        📍

                        <span th:text="${job.location}">
                            Location
                        </span>

                    </p>

                </div>


                <div class="text-end">

                    <small class="text-muted">

                        Saved:

                        <span th:text="${job.savedAt}">
                        </span>

                    </small>

                </div>

            </div>


            <p class="text-muted"
               th:text="${job.description}">

                Job description

            </p>


            <div class="mt-3">

                <a th:if="${job.redirectUrl != null}"
                   th:href="${job.redirectUrl}"
                   target="_blank"
                   class="btn btn-primary btn-sm">

                    Apply Now →

                </a>


                <form
                    th:action="@{/jobs/delete/{id}(id=${job.id})}"
                    method="post"
                    class="d-inline">

                    <button type="submit"
                            class="btn btn-outline-danger btn-sm">

                        🗑 Remove

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<footer class="text-center py-4">

    <p class="text-muted small">

        © 2026 AI Resume Analyzer

    </p>

</footer>


</body>

</html>
