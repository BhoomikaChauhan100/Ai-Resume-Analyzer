<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | AI Resume Analyzer</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <style>

        body {
            background-color: #f4f6f9;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .navbar {
            background-color: white;
            border-bottom: 1px solid #e9ecef;
            min-height: 70px;
        }

        .profile-card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .profile-header {
            background: linear-gradient(
                135deg,
                #0d6efd,
                #315fc7
            );

            color: white;

            padding: 35px;

            border-radius: 18px 18px 0 0;

            text-align: center;
        }

        .profile-icon {

            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: white;

            color: #0d6efd;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;

            margin: 0 auto 15px auto;
        }

        .profile-body {
            padding: 35px;
        }

        .form-control {
            border-radius: 9px;
            padding: 11px 14px;
        }

        .btn {
            border-radius: 9px;
            font-weight: 600;
        }

        .info-label {
            font-weight: 600;
            color: #495057;
        }

    </style>

</head>


<body>


<!-- ========================= -->
<!-- NAVBAR -->
<!-- ========================= -->

<nav class="navbar shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold text-primary"
            th:href="@{/dashboard}">

            🚀 AI Resume Analyzer

        </a>


        <a
            th:href="@{/dashboard}"
            class="btn btn-outline-primary btn-sm">

            ← Dashboard

        </a>

    </div>

</nav>


<!-- ========================= -->
<!-- MAIN -->
<!-- ========================= -->

<div class="container py-5">


    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">


            <!-- PROFILE CARD -->

            <div class="card profile-card">


                <!-- HEADER -->

                <div class="profile-header">

                    <div class="profile-icon">

                        <i class="bi bi-person-fill"></i>

                    </div>


                    <h2 class="fw-bold mb-1">

                        My Profile

                    </h2>


                    <p class="mb-0 opacity-75">

                        Manage your personal information

                    </p>

                </div>


                <!-- BODY -->

                <div class="profile-body">


                    <!-- SUCCESS MESSAGE -->

                    <div
                        th:if="${success}"
                        class="alert alert-success alert-dismissible fade show"
                        role="alert">

                        <strong>Success!</strong>

                        <span th:text="${success}">
                            Profile updated successfully!
                        </span>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                        </button>

                    </div>


                    <!-- ERROR MESSAGE -->

                    <div
                        th:if="${error}"
                        class="alert alert-danger"
                        role="alert">

                        <span th:text="${error}">
                            Something went wrong.
                        </span>

                    </div>


                    <!-- PROFILE FORM -->

                    <form
                        method="post"
                        th:action="@{/profile/update}">


                        <!-- NAME -->

                        <div class="mb-4">

                            <label
                                for="name"
                                class="form-label info-label">

                                Full Name

                            </label>

                  
							          <input
                                type="text"
                                id="name"
                                name="name"
                                class="form-control"
                                th:value="${profile.name}"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-4">

                            <label
                                for="email"
                                class="form-label info-label">

                                Email Address

                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                th:value="${profile.email}"
                                readonly>

                            <div class="form-text">

                                Email cannot be changed.

                            </div>

                        </div>


                        <!-- PHONE -->

                        <div class="mb-4">

                            <label
                                for="phone"
                                class="form-label info-label">

                                Phone Number

                            </label>

                            <input
                                type="text"
                                id="phone"
                                name="phone"
                                class="form-control"
                                th:value="${profile.phone}"
                                placeholder="Enter your phone number">

                        </div>


                        <!-- ROLE -->

                        <div class="mb-4">

                            <label
                                class="form-label info-label">

                                Account Role

                            </label>

                            <input
                                type="text"
                                class="form-control"
                               th:value="${profile.role}"
                                readonly>

                        </div>


                        <!-- PROVIDER -->

                        <div class="mb-4">

                            <label
                                class="form-label info-label">

                                Login Provider

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                th:value="${profile.provider}"
                                readonly>

                        </div>


                        <!-- ACCOUNT STATUS -->

                        <div class="mb-4">

                            <label
                                class="form-label info-label">

                                Account Status

                            </label>

                            <div>

                                <span
                                   th:if="${profile.enabled}"
                                    class="badge bg-success">

                                    Active

                                </span>


                                <span
                                    th:unless="${profile.enabled}"
                                    class="badge bg-danger">

                                    Disabled

                                </span>

                            </div>

                        </div>


                        <!-- CREATED AT -->

                        <div class="mb-4">

                            <label
                                class="form-label info-label">

                                Member Since

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                th:value="${profile.createdAt}"
                                readonly>

                        </div>


                        <!-- BUTTONS -->

                        <div class="d-flex gap-2 mt-4">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="bi bi-save"></i>

                                Save Changes

                            </button>


                            <a
                                th:href="@{/dashboard}"
                                class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>


                    </form>

                </div>

            </div>


            <!-- FOOTER -->

            <p class="text-center text-muted small mt-4">

                © 2026 AI Resume Analyzer

            </p>


        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
